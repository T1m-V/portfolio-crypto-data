name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run python -m pytest
      - run: uv build
