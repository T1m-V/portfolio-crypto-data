[project]
name = "portfolio-crypto-data"
version = "0.2.0"
description = "Crypto transaction extraction, protocol accounting, and dashboard artifacts"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=2.3.3",
    "portfolio-core @ git+https://github.com/T1m-V/portfolio-core.git@v0.2.0",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "web3>=7.14.0",
]

[project.scripts]
portfolio-crypto = "portfolio_crypto_data.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.10"]

[build-system]
requires = ["uv-build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.3,<0.13"
preview-features = ["centralized-project-envs"]

[tool.uv.sources]
portfolio-core = { path = "../portfolio-core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
